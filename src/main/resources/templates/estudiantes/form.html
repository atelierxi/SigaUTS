<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Estudiante – SigaUTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --uts-verde: #6ab023; --uts-verde-dark: #558d1c; }
        .navbar-uts { background: linear-gradient(135deg, var(--uts-verde), var(--uts-verde-dark)); }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark navbar-uts px-4 py-2">
    <a class="navbar-brand fw-bold fs-5" th:href="@{/admin/dashboard}">
        <i class="bi bi-mortarboard-fill me-2"></i>SigaUTS
    </a>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white small">
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="name"></span>
        </span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>Salir
            </button>
        </form>
    </div>
</nav>

<div class="container py-5" style="max-width:560px;">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">
                <i class="bi bi-people me-2"></i>
                <span th:text="${modoEdicion} ? 'Editar estudiante' : 'Nuevo estudiante'"></span>
            </h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/estudiantes/guardar}" method="post">

                <!-- ID oculto solo en edición -->
                <input type="hidden" name="idEstudiante"
                       th:if="${estudiante.idEstudiante != null}"
                       th:value="${estudiante.idEstudiante}">

                <p class="text-muted small mb-3">Datos de acceso al sistema</p>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre completo</label>
                    <input type="text" class="form-control" name="nombre"
                           th:value="${estudiante.usuario != null ? estudiante.usuario.nombre : ''}"
                           required maxlength="100">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Correo</label>
                    <input type="email" class="form-control" name="correo"
                           th:value="${estudiante.usuario != null ? estudiante.usuario.correo : ''}"
                           required maxlength="100">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Contraseña
                        <small class="text-muted fw-normal" th:if="${modoEdicion}">
                            (dejar vacío para no cambiar)
                        </small>
                    </label>
                    <input type="password" class="form-control" name="contrasenaPlana"
                           th:required="${!modoEdicion}">
                </div>

                <hr>
                <p class="text-muted small mb-3">Datos académicos</p>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Código estudiantil</label>
                        <input type="text" class="form-control" name="codigo"
                               th:value="${estudiante.codigo}"
                               required maxlength="15">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Semestre</label>
                        <input type="number" class="form-control" name="semestre"
                               th:value="${estudiante.semestre}"
                               min="1" max="10" required>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-success px-4">
                        <i class="bi bi-save me-1"></i>Guardar
                    </button>
                    <a th:href="@{/admin/estudiantes}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
