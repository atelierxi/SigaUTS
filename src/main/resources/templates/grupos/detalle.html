<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Alumnos del grupo – SigaUTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --uts-verde: #6ab023; --uts-verde-dark: #558d1c; }
        .navbar-uts { background: linear-gradient(135deg, var(--uts-verde), var(--uts-verde-dark)); }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark navbar-uts px-4 py-2">
    <a class="navbar-brand fw-bold fs-5" th:href="@{/admin/dashboard}">
        <i class="bi bi-mortarboard-fill me-2"></i>SigaUTS
    </a>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white small">
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="name">usuario</span>
        </span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>Salir
            </button>
        </form>
    </div>
</nav>

<div class="container py-5">

    <!-- Alertas -->
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Encabezado del grupo -->
    <div class="mb-4">
        <h2 class="fw-bold">
            <i class="bi bi-people-fill me-2 text-info"></i>Alumnos matriculados
        </h2>
        <p class="text-muted mb-0">
            Grupo: <strong th:text="${grupo.nombreGrupo}"></strong>
            &nbsp;|&nbsp;
            Período: <span class="badge bg-secondary" th:text="${grupo.periodo}"></span>
        </p>
    </div>

    <div class="row g-4">

        <!-- Tabla de matriculados -->
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold">
                    <i class="bi bi-list-ul me-1"></i>Listado de alumnos
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Estado</th>
                                <th class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="mat : ${matriculas}">
                                <td th:text="${mat.estudiante.usuario.nombre}"></td>
                                <td th:text="${mat.estudiante.usuario.correo}"></td>
                                <td>
                                    <span th:text="${mat.estado}"
                                          th:classappend="${mat.estado.name() == 'Activa'} ? 'badge bg-success' : 'badge bg-secondary'">
                                    </span>
                                </td>
                                <td class="text-center">
                                    <form th:action="@{/admin/grupos/matricula/cancelar/{id}(id=${mat.idMatricula})}"
                                          method="post"
                                          onsubmit="return confirm('¿Cancelar esta matrícula?')">
                                        <input type="hidden" name="idGrupo" th:value="${grupo.idGrupo}">
                                        <button class="btn btn-danger btn-sm" title="Cancelar matrícula">
                                            <i class="bi bi-person-dash-fill"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(matriculas)}">
                                <td colspan="4" class="text-center text-muted py-4">
                                    No hay alumnos matriculados en este grupo.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Formulario para matricular alumno -->
        <div class="col-12 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold bg-success text-white">
                    <i class="bi bi-person-plus-fill me-1"></i>Matricular alumno
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/grupos/{id}/matricular(id=${grupo.idGrupo})}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Seleccionar estudiante</label>
                            <select name="idEstudiante" class="form-select" required>
                                <option value="" disabled selected>-- Elige un estudiante --</option>
                                <option th:each="est : ${estudiantes}"
                                        th:value="${est.idEstudiante}"
                                        th:text="${est.usuario.nombre} + ' (' + ${est.usuario.correo} + ')'">
                                </option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-plus-circle me-1"></i>Matricular
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <a th:href="@{/admin/grupos}" class="btn btn-outline-secondary mt-4">
        <i class="bi bi-arrow-left me-1"></i>Volver a grupos
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
