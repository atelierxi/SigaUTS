<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Grupos – SigaUTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --uts-verde: #6ab023; --uts-verde-dark: #558d1c; }
        .navbar-uts { background: linear-gradient(135deg, var(--uts-verde), var(--uts-verde-dark)); }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark navbar-uts px-4 py-2">
    <a class="navbar-brand fw-bold fs-5" th:href="@{/admin/dashboard}">
        <i class="bi bi-mortarboard-fill me-2"></i>SigaUTS
    </a>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white small">
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="name"></span>
        </span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>Salir
            </button>
        </form>
    </div>
</nav>

<div class="container py-5">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-collection-fill me-2 text-info"></i>Grupos
        </h2>
        <a th:href="@{/admin/grupos/nuevo}" class="btn btn-info text-white">
            <i class="bi bi-plus-lg me-1"></i>Nuevo grupo
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Nombre grupo</th>
                        <th>Materia</th>
                        <th>Docente</th>
                        <th>Periodo</th>
                        <th>Cupo</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="g : ${grupos}">
                        <td th:text="${g.idGrupo}"></td>
                        <td th:text="${g.nombreGrupo != null ? g.nombreGrupo : '—'}"></td>
                        <td>
                            <span th:text="${g.materia.nombre}"></span><br>
                            <small class="text-muted" th:text="${g.materia.codigo}"></small>
                        </td>
                        <td th:text="${g.docente.usuario.nombre}"></td>
                        <td><span class="badge bg-secondary" th:text="${g.periodo}"></span></td>
                        <td th:text="${g.cupoMaximo != null ? g.cupoMaximo : '∞'}"></td>
                        <td class="text-center">
                            <a th:href="@{/admin/grupos/{id}/alumnos(id=${g.idGrupo})}"
                               class="btn btn-info btn-sm text-white me-1" title="Ver alumnos">
                                <i class="bi bi-people-fill"></i>
                            </a>
                            <a th:href="@{/admin/grupos/editar/{id}(id=${g.idGrupo})}"
                               class="btn btn-warning btn-sm me-1" title="Editar">
                                <i class="bi bi-pencil-fill"></i>
                            </a>
                            <form th:action="@{/admin/grupos/eliminar/{id}(id=${g.idGrupo})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar este grupo?')">
                                <button class="btn btn-danger btn-sm" title="Eliminar">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(grupos)}">
                        <td colspan="7" class="text-center text-muted py-4">No hay grupos registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary mt-4">
        <i class="bi bi-arrow-left me-1"></i>Volver al panel
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
