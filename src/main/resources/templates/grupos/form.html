<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Editar Grupo – SigaUTS' : 'Nuevo Grupo – SigaUTS'">Grupo – SigaUTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --uts-verde: #6ab023; --uts-verde-dark: #558d1c; }
        .navbar-uts { background: linear-gradient(135deg, var(--uts-verde), var(--uts-verde-dark)); }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark navbar-uts px-4 py-2">
    <a class="navbar-brand fw-bold fs-5" th:href="@{/admin/dashboard}">
        <i class="bi bi-mortarboard-fill me-2"></i>SigaUTS
    </a>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white small">
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="name">usuario</span>
        </span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>Salir
            </button>
        </form>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-header fw-semibold">
                    <i class="bi bi-people-fill me-2 text-success"></i>
                    <span th:text="${modoEdicion} ? 'Editar grupo' : 'Nuevo grupo'">Grupo</span>
                </div>
                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/admin/grupos/guardar}" method="post" th:object="${grupo}">

                        <input type="hidden" th:field="*{idGrupo}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre del grupo</label>
                            <input type="text" class="form-control" th:field="*{nombreGrupo}"
                                   placeholder="Ej: Grupo A" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Período</label>
                            <input type="text" class="form-control" th:field="*{periodo}"
                                   placeholder="Ej: 2025-1" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Cupo máximo</label>
                            <input type="number" class="form-control" th:field="*{cupoMaximo}"
                                   min="1" placeholder="Ej: 30" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Materia</label>
                            <select name="idMateria" class="form-select" required>
                                <option value="" disabled>-- Selecciona una materia --</option>
                                <option th:each="mat : ${materias}"
                                        th:value="${mat.idMateria}"
                                        th:text="${mat.nombre} + ' (' + ${mat.codigo} + ')'"
                                        th:selected="${modoEdicion and grupo.materia != null and grupo.materia.idMateria == mat.idMateria}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Docente</label>
                            <select name="idDocente" class="form-select" required>
                                <option value="" disabled>-- Selecciona un docente --</option>
                                <option th:each="doc : ${docentes}"
                                        th:value="${doc.idDocente}"
                                        th:text="${doc.usuario.nombre}"
                                        th:selected="${modoEdicion and grupo.docente != null and grupo.docente.idDocente == doc.idDocente}">
                                </option>
                            </select>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-floppy me-1"></i>
                                <span th:text="${modoEdicion} ? 'Guardar cambios' : 'Crear grupo'">Guardar</span>
                            </button>
                            <a th:href="@{/admin/grupos}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
